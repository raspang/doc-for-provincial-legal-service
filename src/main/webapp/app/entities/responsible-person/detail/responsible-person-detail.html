<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (responsiblePerson(); as responsiblePersonRef) {
      <div>
        <h2 data-cy="responsiblePersonDetailsHeading"><span>Responsible Person</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ responsiblePersonRef.id }}</span>
          </dd>
          <dt><span>Name</span></dt>
          <dd>
            <span>{{ responsiblePersonRef.name }}</span>
          </dd>
          <dt><span>Position</span></dt>
          <dd>
            <span>{{ responsiblePersonRef.position }}</span>
          </dd>
          <dt><span>Email</span></dt>
          <dd>
            <span>{{ responsiblePersonRef.email }}</span>
          </dd>
          <dt><span>Contact No</span></dt>
          <dd>
            <span>{{ responsiblePersonRef.contactNo }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/responsible-person', responsiblePersonRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
