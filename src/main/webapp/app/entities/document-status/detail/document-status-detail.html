<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (documentStatus(); as documentStatusRef) {
      <div>
        <h2 data-cy="documentStatusDetailsHeading"><span>Document Status</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span>ID</span></dt>
          <dd>
            <span>{{ documentStatusRef.id }}</span>
          </dd>
          <dt><span>Name</span></dt>
          <dd>
            <span>{{ documentStatusRef.name }}</span>
          </dd>
          <dt><span>Color</span></dt>
          <dd>
            <span>{{ documentStatusRef.color }}</span>
          </dd>
          <dt><span>Warning</span></dt>
          <dd>
            <span>{{ documentStatusRef.warning }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/document-status', documentStatusRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
